name: Build and test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run placement tests
        shell: powershell
        run: .\tests\run-tests.ps1
      - name: Build tray application
        shell: powershell
        run: .\build.ps1
      - name: Upload Windows executable
        uses: actions/upload-artifact@v7
        with:
          name: PipEdgeKeeper-windows
          path: dist/PipEdgeKeeper.exe
          if-no-files-found: error
