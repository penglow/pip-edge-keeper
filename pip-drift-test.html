<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PiP drift test</title>
</head>
<body style="background:#222;color:#eee;font-family:sans-serif">
<h1>PiP drift test</h1>
<p>Enter PiP, move the native window flush against a screen edge or corner,
then use the stream-swap buttons. Stream B has identical natural dimensions;
stream C changes resolution but not aspect ratio; stream D changes aspect
ratio.</p>
<video id="v" autoplay muted playsinline style="width:320px;background:#000"></video>
<div>
  <button id="pip" disabled>1. Enter PiP (stream A 640x360)</button>
  <button id="swapB" disabled>2. Swap to stream B (640x360, same size)</button>
  <button id="swapC" disabled>3. Swap to stream C (960x540, same aspect)</button>
  <button id="swapD" disabled>4. Swap to stream D (480x480, new aspect)</button>
  <button id="exit" disabled>5. Exit PiP</button>
</div>
<p>Video state: <output id="state">waiting for metadata</output></p>
<pre id="log"></pre>
<script>
const log = m => { document.getElementById('log').textContent += m + '\n'; };
function makeStream(w, h, color, label) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const ctx = c.getContext('2d');
  let t = 0;
  const draw = () => {
    t++;
    ctx.fillStyle = color;
    ctx.fillRect(0, 0, w, h);
    ctx.fillStyle = '#fff';
    ctx.font = '48px sans-serif';
    ctx.fillText(label + ' ' + t, 40, h / 2);
  };
  draw();
  setInterval(draw, 100);
  return c.captureStream(10);
}
const A = makeStream(640, 360, '#06c', 'A');
const B = makeStream(640, 360, '#c30', 'B');
const C = makeStream(960, 540, '#083', 'C');
const D = makeStream(480, 480, '#849', 'D');
const v = document.getElementById('v');
const pipButton = document.getElementById('pip');
const swapButtons = [
  document.getElementById('swapB'),
  document.getElementById('swapC'),
  document.getElementById('swapD')
];
const exitButton = document.getElementById('exit');
const state = document.getElementById('state');

function updateState(prefix) {
  const size = v.videoWidth && v.videoHeight
    ? v.videoWidth + 'x' + v.videoHeight
    : 'metadata unavailable';
  state.textContent = prefix + '; natural size=' + size +
    '; inPiP=' + (document.pictureInPictureElement === v);
}

function setPipControls(inPip) {
  pipButton.disabled = inPip || !document.pictureInPictureEnabled;
  for (const button of swapButtons) button.disabled = !inPip;
  exitButton.disabled = !inPip;
}

function waitForMediaEvent(eventName, timeoutMs = 5000) {
  return new Promise((resolve, reject) => {
    const onEvent = () => {
      clearTimeout(timer);
      resolve();
    };
    const timer = setTimeout(() => {
      v.removeEventListener(eventName, onEvent);
      reject(new Error('timed out waiting for ' + eventName));
    }, timeoutMs);
    v.addEventListener(eventName, onEvent, { once: true });
  });
}

v.addEventListener('loadedmetadata', () => {
  pipButton.disabled = !document.pictureInPictureEnabled;
  updateState('stream A ready');
  log('stream A ready: ' + v.videoWidth + 'x' + v.videoHeight);
}, { once: true });
v.addEventListener('resize', () => {
  updateState('video resize event');
  log('natural size now ' + v.videoWidth + 'x' + v.videoHeight);
});

pipButton.onclick = async () => {
  try {
    await v.play();
    await v.requestPictureInPicture();
    log('PiP entered');
  }
  catch (e) { log('PiP failed: ' + e.name + ' ' + e.message); }
};
const swap = (stream, name, expectedWidth, expectedHeight) => async () => {
  for (const button of swapButtons) button.disabled = true;
  try {
    const metadataReady = waitForMediaEvent('loadedmetadata');
    v.srcObject = stream;
    await metadataReady;
    await v.play();
    if (v.videoWidth !== expectedWidth || v.videoHeight !== expectedHeight) {
      throw new Error('expected ' + expectedWidth + 'x' + expectedHeight +
        ', got ' + v.videoWidth + 'x' + v.videoHeight);
    }
    updateState('swapped to stream ' + name);
    log('verified stream ' + name + ': ' + v.videoWidth + 'x' +
      v.videoHeight + '; inPiP=' +
      (document.pictureInPictureElement === v));
  } catch (e) {
    log('swap to ' + name + ' failed: ' + e.name + ' ' + e.message);
  } finally {
    setPipControls(document.pictureInPictureElement === v);
  }
};
document.getElementById('swapB').onclick = swap(B, 'B', 640, 360);
document.getElementById('swapC').onclick = swap(C, 'C', 960, 540);
document.getElementById('swapD').onclick = swap(D, 'D', 480, 480);
exitButton.onclick = async () => {
  try {
    await document.exitPictureInPicture();
    log('exited');
  } catch (e) {
    log('exit failed: ' + e.name + ' ' + e.message);
  }
};
v.addEventListener('enterpictureinpicture', () => {
  setPipControls(true);
  updateState('PiP entered');
});
v.addEventListener('leavepictureinpicture', () => {
  setPipControls(false);
  updateState('left PiP');
  log('left PiP');
});
v.srcObject = A;
</script>
</body>
</html>
